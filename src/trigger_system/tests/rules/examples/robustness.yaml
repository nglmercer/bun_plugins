# Example Rules: Robustness & Data Handling

# 1. Handling potentially missing data
# Use || syntax in interpolation to provide defaults.
- id: welcome-user
  on: USER_JOINED
  do:
    type: log
    params:
      message: "Welcome, ${data.username || 'Guest'}!"

# 2. Check for missing data in conditions
# If data.role is missing/undefined, it won't equal "admin".
- id: admin-check
  on: COMMAND
  if:
    field: data.role
    operator: EQ
    value: admin
  do:
    type: execute
    params:
      command: "echo Admin Command Executed"
      safe: true

# 3. Using State Persistence (Counter)
- id: global-counter
  on: ANY_EVENT
  do:
    type: STATE_INCREMENT
    params:
      key: global_event_count

# 4. Complex Logic with Fallbacks
- id: complex-fallback
  on: ALERT
  do:
    type: log
    params:
      # Access nested property safely. If data.server is null, this defaults to 'Unknown'.
      message: "Alert on server: ${data.server && data.server.name ? data.server.name : 'Unknown'}"
